# --- Sensor: I2C bus and the interrupt pin ---
CONFIG_I2C=y
CONFIG_GPIO=y

# --- C++ and the C library TFLite Micro needs ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBC=y

# --- TensorFlow Lite Micro, with Arm's optimized CMSIS-NN kernels ---
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y

# --- Hardware floating point (Cortex-M4F) ---
CONFIG_FPU=y

# --- Cycle-accurate timing for the per-window processing time ---
CONFIG_TIMING_FUNCTIONS=y

# --- Let printk print floats ---
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Processing runs in main(); lower priority than the sensor thread (2) ---
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_MAIN_STACK_SIZE=4096
