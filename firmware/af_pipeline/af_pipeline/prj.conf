# Kconfig: switches that decide which parts of Zephyr are compiled in.

# --- C++ and the C library TFLite Micro needs ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBC=y

# --- TensorFlow Lite Micro, with Arm's optimized CMSIS-NN kernels ---
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y

# --- Hardware floating point (the nRF52840's Cortex-M4F has an FPU) ---
CONFIG_FPU=y

# --- Cycle-accurate timing for measuring inference latency ---
CONFIG_TIMING_FUNCTIONS=y

# --- Let printk print floats ---
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Room for the pipeline's work buffers in main() ---
CONFIG_MAIN_STACK_SIZE=8192
